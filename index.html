<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ഡിജിറ്റൽ വായനശാല</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .header { text-align: center; margin-bottom: 30px; }
    .tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
    .tab-btn { padding: 10px 20px; border: none; background: #e0e0e0; cursor: pointer; border-radius: 5px; font-weight: bold; }
    .tab-btn.active { background: #0070f3; color: white; }
    .content-section { display: none; }
    .content-section.active { display: block; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .card h3 { margin-top: 0; color: #0070f3; }
    .read-btn { display: inline-block; width: 100%; padding: 10px; background: #28a745; color: white; border: none; text-align: center; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    
    .reader-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000; }
    .reader-content { position: relative; width: 90%; height: 90%; margin: 2% auto; background: white; border-radius: 8px; overflow: hidden; }
    .close-btn { position: absolute; top: 10px; right: 15px; background: red; color: white; border: none; padding: 5px 12px; cursor: pointer; border-radius: 4px; z-index: 1001; font-weight: bold; }
    iframe { width: 100%; height: 100%; border: none; }
    
    table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #0070f3; color: white; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📚 ഓൺലൈൻ വായനശാല</h1>
  </div>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('books-tab', this)">📖 പുസ്തകങ്ങൾ</button>
    <button class="tab-btn" onclick="switchTab('members-tab', this)">👥 അംഗങ്ങൾ</button>
  </div>

  <!-- Books Tab -->
  <div id="books-tab" class="content-section active">
    <div id="books-grid" class="grid"></div>
  </div>

  <!-- Members Tab -->
  <div id="members-tab" class="content-section">
    <table>
      <thead>
        <tr>
          <th>Member ID</th>
          <th>പേര്</th>
          <th>Join Date</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="members-table"></tbody>
    </table>
  </div>

  <!-- Ebook Reader Modal -->
  <div id="reader-modal" class="reader-modal">
    <div class="reader-content">
      <button class="close-btn" onclick="closeReader()">X Close</button>
      <iframe id="book-frame" src=""></iframe>
    </div>
  </div>

  <script>
    function switchTab(tabId, btn) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(tabId).classList.add('active');
      btn.classList.add('active');
    }

    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',').map(h => h.trim());
      return lines.slice(1).map(line => {
        const values = line.split(',').map(v => v.trim());
        let obj = {};
        headers.forEach((h, i) => { obj[h] = values[i]; });
        return obj;
      });
    }

    fetch('books.csv')
      .then(res => res.text())
      .then(text => {
        const books = parseCSV(text);
        const grid = document.getElementById('books-grid');
        books.forEach(book => {
          grid.innerHTML += `
            <div class="card">
              <h3>${book.title}</h3>
              <p><strong>രചയിതാവ്:</strong> ${book.author}</p>
              <p><strong>വിഭാഗം:</strong> ${book.category}</p>
              <p>${book.description}</p>
              <button class="read-btn" onclick="openReader('${book.archive_id}')">ഇവിടെ വായിക്കുക 📖</button>
            </div>
          `;
        });
      });

    fetch('members.csv')
      .then(res => res.text())
      .then(text => {
        const members = parseCSV(text);
        const table = document.getElementById('members-table');
        members.forEach(m => {
          table.innerHTML += `
            <tr>
              <td>${m.member_id}</td>
              <td>${m.name}</td>
              <td>${m.join_date}</td>
              <td><span style="color: green; font-weight: bold;">${m.status}</span></td>
            </tr>
          `;
        });
      });

    function openReader(archiveId) {
      const modal = document.getElementById('reader-modal');
      const frame = document.getElementById('book-frame');
      frame.src = `https://archive.org/embed/${archiveId}?ui=embed`;
      modal.style.display = 'block';
    }

    function closeReader() {
      const modal = document.getElementById('reader-modal');
      const frame = document.getElementById('book-frame');
      frame.src = '';
      modal.style.display = 'none';
    }
  </script>

</body>
</html>
